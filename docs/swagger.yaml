openapi: 3.0.0
info:
  title: Senior Transit Pass API
  version: 1.0.0
  description: API for managing senior transit applications

servers:
  - url: http://localhost:3000/api/v1

paths:
  /applications:
    get:
      summary: Get all applications
      responses:
        '200':
          description: OK

    post:
      summary: Create application
      responses:
        '201':
          description: Created

  /applications/{id}:
    get:
      summary: Get application by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK

  /passes:
    get:
      summary: Get all passes
      responses:
        '200':
          description: OK

    post:
      summary: Create pass
      responses:
        '201':
          description: Created