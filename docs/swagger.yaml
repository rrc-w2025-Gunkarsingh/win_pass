openapi: 3.0.0
info:
  title: Senior Transit Pass API
  version: 1.0.0
  description: API for managing senior transit applications

servers:
  - url: http://localhost:3000/api/v1

paths:
  /applications:
    get:
      summary: Get all applications
      responses:
        '200':
          description: List of applications

    post:
      summary: Create a new application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Senior Pass Application
      responses:
        '201':
          description: Application created

  /applications/{id}:
    get:
      summary: Get application by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Application found

    put:
      summary: Update application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Updated Application
      responses:
        '200':
          description: Application updated

    delete:
      summary: Delete application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Application deleted

          /passes:
  post:
    summary: Create a transit pass
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              age:
                type: number
              balance:
                type: number
              ridesLeft:
                type: number
    responses:
      201:
        description: Pass created

  get:
    summary: Get all passes
    responses:
      200:
        description: List of passes

/passes/verify/{id}:
  get:
    summary: Verify pass validity
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      200:
        description: Pass validity result

/passes/use/{id}:
  post:
    summary: Use a ride
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      200:
        description: Ride used

/passes/topup/{id}:
  post:
    summary: Top up balance
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              amount:
                type: number
    responses:
      200:
        description: Balance updated